trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'

steps:

    - script: mvn validate
      displayName: 'Maven Validate'
  
    - script: mvn compile
      displayName: 'Maven Compile completed successfully'

    - script: mvn test
      displayName: 'Maven test completed successfully'
    
    - script: mvn package
      displayName: 'Maven package completed successfully'
      env:
        MAVEN_OPTS: -DskipTests=true
    
    - task: CopyFiles@2
      inputs:
        #SourceFolder: '/home/runner/work/1/s/webapp/target'
        Contents: '**/*.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
