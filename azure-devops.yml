trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'

steps:
    - script: mvn validate
      displayName: 'Maven Validate'
  
    - script: mvn compile
      displayName: 'Maven Compile completed successfully'

    - script: mvn test
      displayName: 'Maven test completed successfully'
    
    - script: mvn package -DskipTests=true
      displayName: 'Maven package completed successfully'
    
    - script: mv webapp/target/webapp.war webapp/target/ROOT.war
      displayName: 'Rename webapp.war to ROOT.war'
    
    - task: CopyFiles@2
      displayName: 'Copy ROOT.war to Staging'
      inputs:
        SourceFolder: 'webapp/target'
        Contents: 'ROOT.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact: drop'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
